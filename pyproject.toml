[project]
name = "ha-timescaledb-recorder"
version = "0.1.0"
requires-python = ">=3.14.2"

[tool.pytest]
asyncio_mode = "auto"
testpaths = ["tests"]
# A never-awaited coroutine is a silently skipped code path (or a mock dropping one);
# fail instead of warning. It is reported at garbage collection, where pytest wraps it
# as PytestUnraisableExceptionWarning — possibly under a later test than the culprit.
filterwarnings = ["error::RuntimeWarning", "error::pytest.PytestUnraisableExceptionWarning"]

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "psycopg[binary]==3.3.6",
    "pytest>=9.0",
    "pytest-asyncio>=0.24",
    "pytest-homeassistant-custom-component==0.13.375",
]

[tool.basedpyright]
# "standard" plus a few cheap, high-signal rules. The "recommended"/"all" sets add thousands of
# reportUnknown*/reportAny warnings driven by HA/psycopg/MagicMock typing, which are noise here.
typeCheckingMode = "standard"
reportMissingTypeArgument = "error"
reportUnnecessaryTypeIgnoreComment = "error"
